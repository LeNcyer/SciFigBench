name: Tests and distributions
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest --junitxml=test-results.xml
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml

  build:
    name: Build and verify distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install build and description-check tools
        run: python -m pip install build twine Pillow "readme-renderer[md]==44.0"
      - name: Build from this Commit
        run: python -m build
      - name: Validate versions, archives, license and source identity
        run: python .github/scripts/verify_dist.py --provenance "${{ runner.temp }}/build-provenance.json"
      - run: python -m twine check --strict dist/*
      - name: Preview packaged README
        run: python .github/scripts/check_readme.py --preview "${{ runner.temp }}/pypi-readme.html"
      - name: Install wheel and sdist in separate clean environments
        run: python .github/scripts/smoke_install.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-provenance
          path: |
            ${{ runner.temp }}/build-provenance.json
            ${{ runner.temp }}/pypi-readme.html
          if-no-files-found: error
